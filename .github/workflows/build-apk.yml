name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - remove-about-ftp-internet

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Create Android test keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/testkey.jks" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$SDK_BUILD_TOOLS/zipalign" -f 4 app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/testkey.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out app/build/outputs/apk/debug/MaterialFiles-debug.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/MaterialFiles-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaterialFiles-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/MaterialFiles-debug.apk
          if-no-files-found: error
          retention-days: 7
