name: Android CI

on:
  push:
    branches:
      - master
      - remove-about-ftp-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build required dav4jvm commit locally
        run: |
          git clone --depth 1 https://github.com/bitfireAT/dav4jvm.git "$RUNNER_TEMP/dav4jvm"
          git -C "$RUNNER_TEMP/dav4jvm" fetch --depth 1 origin c1bc14348831bcdb00f3a6eec4859b81c7dc3728
          git -C "$RUNNER_TEMP/dav4jvm" checkout c1bc14348831bcdb00f3a6eec4859b81c7dc3728
          chmod +x "$RUNNER_TEMP/dav4jvm/gradlew"
          cd "$RUNNER_TEMP/dav4jvm"
          ./gradlew --no-daemon publishToMavenLocal

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Create Android test keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/testkey.jks" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f 4 app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/testkey.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out app/build/outputs/apk/debug/MaterialFiles-debug.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/MaterialFiles-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaterialFiles-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/MaterialFiles-debug.apk
          if-no-files-found: error
          retention-days: 10
